# autoform-panel — anker.besender.lyp04.com
# Front the native Node server (127.0.0.1:18788) with TLS. This vhost ships inside the
# project (nginx/anker-form.conf); enable it by symlinking into sites-enabled.

server {
    listen      80;
    listen [::]:80;
    server_name anker.besender.lyp04.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen      443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name anker.besender.lyp04.com;

    ssl_certificate     /etc/letsencrypt/live/anker.besender.lyp04.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anker.besender.lyp04.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header Referrer-Policy           "no-referrer"      always;

    access_log /var/log/nginx/anker-form.access.log;
    error_log  /var/log/nginx/anker-form.error.log;

    # form-profiles.json can be a few hundred KB; catalog publish posts the full set.
    client_max_body_size 8m;

    location / {
        proxy_pass              http://127.0.0.1:18788;
        proxy_http_version      1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }
}
