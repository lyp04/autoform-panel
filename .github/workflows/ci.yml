name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          for f in $(git ls-files '*.mjs' '*.js'); do node --check "$f"; done
      # The full test suite lives in the upstream kit (it needs the Android app/
      # assets that are not part of this panel-only checkout).
